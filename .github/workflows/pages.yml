name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Cache prepared NFCorpus
        id: nfcorpus-cache
        uses: actions/cache@v4
        with:
          path: public/data/nfcorpus.jsonl
          key: nfcorpus-beir-${{ hashFiles('scripts/prepare-nfcorpus.ts') }}
      - name: Download and prepare NFCorpus
        if: steps.nfcorpus-cache.outputs.cache-hit != 'true'
        run: |
          if curl --fail --location --connect-timeout 15 --max-time 60 --retry 1 https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip --output "$RUNNER_TEMP/nfcorpus.zip"; then
            unzip -q "$RUNNER_TEMP/nfcorpus.zip" -d "$RUNNER_TEMP/nfcorpus-data"
            npm run prepare:nfcorpus -- "$RUNNER_TEMP/nfcorpus-data/nfcorpus/corpus.jsonl"
          else
            echo '::warning::BEIR is unavailable; using the previously published, checksum-verified NFCorpus input.'
            mkdir -p public/data
            curl --fail --location --connect-timeout 20 --max-time 120 --retry 1 https://castorini.github.io/ragbox/data/nfcorpus.jsonl --output public/data/nfcorpus.jsonl
          fi
      - name: Verify NFCorpus identity
        run: echo '7e6c0d721548699807a079bd0342bc1357b03e577791f70a967fb3f00d9b4d80  public/data/nfcorpus.jsonl' | sha256sum --check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the Pages path
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_MSMARCO_INDEX_URL: ${{ vars.MSMARCO_INDEX_URL }}
        run: npm run build -- --base=/ragbox/
      - name: Install browser for production checks
        run: npx playwright install --with-deps chromium
      - name: Check production UI and browser storage
        run: npm run test:e2e
      - name: Summarize browser checks
        if: always()
        run: node scripts/report-browser-checks.mjs
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
